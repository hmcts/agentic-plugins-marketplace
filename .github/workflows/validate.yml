name: Validate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # version-bump check needs PR history

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Run validator
        run: python scripts/validate_marketplace.py

      - name: Install pytest
        run: pip install pytest

      - name: Run orchestrator plugin tests
        env:
          SHELLCHECK: shellcheck  # a missing binary fails the shellcheck tests instead of skipping them
        run: python -m pytest plugins/agents/hmcts-sdlc-orchestrator/tests -q
